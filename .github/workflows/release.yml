name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15-intel
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Package DMG (Apple Silicon + Intel)
        run: VERSION="$TAG" sh scripts/package.sh --universal
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/DP32Export-*.dmg build/DP32Export-*-macOS.zip \
            --target "$GITHUB_SHA" \
            --title "DP32 Export ${TAG}" \
            --notes-file docs/RELEASE_NOTES.md
