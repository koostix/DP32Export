name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Package (Apple Silicon + Intel)
        run: VERSION="${GITHUB_REF_NAME}" sh scripts/package.sh --universal
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DP32Export-*-macOS.zip \
            --title "DP32Export ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES.md
